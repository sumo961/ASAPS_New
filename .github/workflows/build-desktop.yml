name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  increment-build-number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment build number
        id: bump
        run: |
          if [ -f build-number.json ]; then
            current=$(jq -r '.build' build-number.json)
          else
            current=0
          fi
          next=$((current + 1))
          echo "{\"build\":$next}" > build-number.json
          echo "build_number=$next" >> "$GITHUB_OUTPUT"
          echo "Build number: $next"

      - name: Commit build number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-number.json
          git commit -m "build: increment build number to ${{ steps.bump.outputs.build_number }} [skip ci]"
          git push origin main

  build-macos:
    needs: increment-build-number
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes build number)
        run: git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: |
          npm run build:electron
          npm run copy-builder

      - name: Package macOS Universal
        working-directory: apps/builder-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder@26.8.1 --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            apps/builder-desktop/release/*.dmg
            apps/builder-desktop/release/*.zip
            apps/builder-desktop/release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    needs: increment-build-number
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes build number)
        run: git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: npm run build:electron

      - name: Copy builder files (Windows)
        working-directory: apps/builder-desktop
        run: |
          if (Test-Path builder) { Remove-Item -Recurse -Force builder }
          Copy-Item -Recurse ../../packages/builder/dist builder
        shell: pwsh

      - name: Package Windows
        working-directory: apps/builder-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder@26.8.1 --win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/builder-desktop/release/*.exe
            apps/builder-desktop/release/latest.yml
          if-no-files-found: error

  release:
    needs: [increment-build-number, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
          echo "build_number=${{ needs.increment-build-number.outputs.build_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ASAPS Builder v${{ steps.version.outputs.version }}
          draft: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest-mac.yml
            release/latest.yml
          fail_on_unmatched_files: false
          body: |
            ## ASAPS Builder v${{ steps.version.outputs.version }}

            ### Downloads
            - **macOS** (Universal - Intel & Apple Silicon): `ASAPS Builder-${{ steps.version.outputs.version }}-universal.dmg`
            - **Windows** (64-bit): `ASAPS Builder Setup ${{ steps.version.outputs.version }}.exe`

            ### Installation
            **macOS**: Open the DMG and drag `ASAPS Builder.app` to Applications.
            **Windows**: Run the installer and follow the prompts.

            ### Auto-Update
            The app will automatically check for updates and notify you when a new version is available.

            ### What's New
            <!-- Add release notes here before publishing -->
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
