name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix)'
        required: false
        default: ''
      linux_only:
        description: 'Only build and smoke-test Linux (no build-number bump, no other platforms, no release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  increment-build-number:
    if: ${{ !inputs.linux_only }}
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment build number
        id: bump
        run: |
          if [ -f build-number.json ]; then
            current=$(jq -r '.build' build-number.json)
          else
            current=0
          fi
          next=$((current + 1))
          echo "{\"build\":$next}" > build-number.json
          echo "build_number=$next" >> "$GITHUB_OUTPUT"
          echo "Build number: $next"

      - name: Commit build number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-number.json
          git commit -m "build: increment build number to ${{ steps.bump.outputs.build_number }} [skip ci]"
          git push origin main

  build-macos:
    needs: increment-build-number
    if: ${{ !inputs.linux_only }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes build number)
        run: git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm install rather than `npm ci` to tolerate the cross-platform
        # optional-dep gap in our lockfile. The local dev install on
        # macOS cannot resolve Linux-only emnapi/wasi-threads packages
        # that some workspace tooling pulls in transitively; `npm ci`
        # fails strictly, `npm install` resolves them on the target
        # platform. Trade-off: each CI run does a fresh resolve instead
        # of a cached one — acceptable since this workflow only runs
        # on release tags and manual dispatch.
        run: npm install --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: |
          npm run build:electron
          npm run copy-builder

      # Signing + notarization credentials. The .p8 must be a FILE for
      # notarytool, so it's materialized into the runner temp dir and the
      # env vars are appended only when the secret exists — fork builds
      # without secrets keep packaging unsigned (electron-builder skips
      # signing when CSC_LINK is empty and notarization when the API-key
      # env is absent).
      - name: Prepare macOS signing credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
            echo "Notarization credentials prepared"
          else
            echo "No ASC key secret — packaging will be unsigned/unnotarized"
          fi

      # electron-builder used to import the p12 itself (CSC_LINK) into a
      # throwaway keychain. The macos-26 runner image build of 2026-08-31
      # broke that path: its `security set-key-partition-list` step fails
      # with "SecKeychainUnlock: passphrase not correct" (v0.9.96, twice).
      # So the cert goes into OUR keychain with the documented Apple/GitHub
      # recipe — long auto-lock timeout, partition list set with the same
      # password, keychain added to the search list — and electron-builder
      # is pointed at it via CSC_KEYCHAIN. No secret → step is a no-op and
      # the build stays unsigned, exactly as before.
      - name: Import signing certificate into a build keychain
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "No signing certificate secret — packaging unsigned"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/asaps-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mac-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/mac-cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/mac-cert.p12"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Identities available for signing:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package macOS Universal
        working-directory: apps/builder-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing identity comes from CSC_KEYCHAIN (set by the import
          # step above). CSC_LINK is deliberately NOT set — see that step.
        # --no-install: use the electron-builder the lockfile installed at
        # the repo root (npm install above) instead of a hand-pinned npx
        # version that drifts from it. The Electron that gets packaged is
        # build.electronVersion in apps/builder-desktop/package.json — keep
        # it equal to the electron devDependency there; v0.9.9x shipped an
        # EOL Electron 40 for a month because only the dependency moved.
        run: npx --no-install electron-builder --mac --publish never

      - name: Verify signature & notarization
        if: env.APPLE_API_KEY != ''
        run: |
          APP=$(ls -d apps/builder-desktop/release/mac-universal/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP" || true
          stapler validate "$APP" || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            apps/builder-desktop/release/*.dmg
            apps/builder-desktop/release/*.zip
            apps/builder-desktop/release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    needs: increment-build-number
    if: ${{ !inputs.linux_only }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes build number)
        run: git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm install rather than `npm ci` to tolerate the cross-platform
        # optional-dep gap in our lockfile. The local dev install on
        # macOS cannot resolve Linux-only emnapi/wasi-threads packages
        # that some workspace tooling pulls in transitively; `npm ci`
        # fails strictly, `npm install` resolves them on the target
        # platform. Trade-off: each CI run does a fresh resolve instead
        # of a cached one — acceptable since this workflow only runs
        # on release tags and manual dispatch.
        run: npm install --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: npm run build:electron

      - name: Copy builder files (Windows)
        working-directory: apps/builder-desktop
        run: |
          if (Test-Path builder) { Remove-Item -Recurse -Force builder }
          Copy-Item -Recurse ../../packages/builder/dist builder
        shell: pwsh

      - name: Package Windows
        working-directory: apps/builder-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            apps/builder-desktop/release/*.exe
            apps/builder-desktop/release/latest.yml
          if-no-files-found: error

  # Linux (beta): AppImage + .deb for x64. Both are started on a virtual
  # display for 20 s before upload, since there is no Linux machine in the
  # loop yet. While Linux is in beta, a failure here does not hold up the
  # macOS / Windows release (see the release job's `if`).
  build-linux:
    needs: increment-build-number
    # Runs after the build-number bump on releases; on its own (bump
    # skipped) for a manual linux_only run.
    if: ${{ always() && (inputs.linux_only || needs.increment-build-number.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes build number)
        run: git pull origin ${{ github.ref_name }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm install, not npm ci — see the Windows job.
        run: npm install --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: |
          npm run build:electron
          rm -rf builder
          cp -r ../../packages/builder/dist builder

      - name: Package Linux
        working-directory: apps/builder-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --linux --publish never

      - name: Smoke test (AppImage and .deb on a virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfuse2t64 > /dev/null || sudo apt-get install -y -qq xvfb libfuse2 > /dev/null
          ls -la apps/builder-desktop/release
          run_for_20s() {
            local label="$1"; shift
            xvfb-run -a "$@" > "$RUNNER_TEMP/$label.log" 2>&1 &
            local pid=$!
            sleep 20
            if kill -0 "$pid" 2>/dev/null; then
              echo "$label: still running after 20 s — no crash on start"
              pkill -f asaps-builder || true; kill "$pid" 2>/dev/null || true
              return 0
            fi
            wait "$pid"; local rc=$?
            echo "$label: exited early with code $rc"; tail -40 "$RUNNER_TEMP/$label.log"
            return 1
          }
          APPIMAGE=$(ls apps/builder-desktop/release/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          # --no-sandbox: Ubuntu 24.04 blocks the Chromium sandbox for
          # AppImages (AppArmor userns restriction) — the README's Linux
          # notes tell users the same.
          run_for_20s appimage "$APPIMAGE" --no-sandbox
          sudo apt-get install -y -qq "./$(ls apps/builder-desktop/release/*.deb | head -1)" > /dev/null
          run_for_20s deb asaps-builder
          echo "--- AppImage log (tail)"; tail -20 "$RUNNER_TEMP/appimage.log" || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            apps/builder-desktop/release/*.AppImage
            apps/builder-desktop/release/*.deb
            apps/builder-desktop/release/latest-linux.yml
          if-no-files-found: error

  # macOS 27 readiness check — packages an unsigned arm64 app on GitHub's
  # xcode-27 image (macOS 27 since 2026-09-10, arm64 only, "preview") and
  # launches it for 20 s to catch a crash-on-start. Non-blocking: the
  # release job does not wait for it and continue-on-error keeps a flaky
  # preview runner from failing the run. Promote to a hard gate once the
  # image leaves preview.
  validate-macos-27:
    needs: increment-build-number
    if: ${{ !inputs.linux_only }}
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Build Electron app
        working-directory: apps/builder-desktop
        run: |
          npm run build:electron
          npm run copy-builder

      - name: Package unsigned arm64 app
        working-directory: apps/builder-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --mac --arm64 --dir -c.mac.identity=null

      - name: Launch smoke test on macOS 27
        run: |
          sw_vers
          APP=$(ls -d apps/builder-desktop/release/mac-arm64/*.app | head -1)
          echo "App: $APP"
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          "$BIN" --no-sandbox > "$RUNNER_TEMP/smoke.log" 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "Still running after 20 s — no crash on start"
            kill "$PID" || true
            STATUS=0
          else
            wait "$PID"; RC=$?
            echo "Process exited early with code $RC"
            STATUS=1
          fi
          echo "--- smoke log (tail)"; tail -50 "$RUNNER_TEMP/smoke.log" || true
          exit $STATUS

  release:
    needs: [increment-build-number, build-macos, build-windows, build-linux]
    # Linux is beta: release once macOS and Windows built, with or without it.
    if: ${{ always() && !inputs.linux_only && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release

      - name: Download Linux artifact (beta)
        if: ${{ needs.build-linux.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: release

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
          echo "build_number=${{ needs.increment-build-number.outputs.build_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ASAPS Builder v${{ steps.version.outputs.version }}
          draft: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest-mac.yml
            release/latest.yml
            release/latest-linux.yml
          fail_on_unmatched_files: false
          body: |
            ## ASAPS Builder v${{ steps.version.outputs.version }}

            ### Downloads
            - **macOS** (Universal - Intel & Apple Silicon): `ASAPS Builder-${{ steps.version.outputs.version }}-universal.dmg`
            - **Windows** (64-bit): `ASAPS Builder Setup ${{ steps.version.outputs.version }}.exe`
            - **Linux** (64-bit, beta): `ASAPS-Builder-${{ steps.version.outputs.version }}-x86_64.AppImage` or `.deb`

            ### Installation
            **macOS**: Open the DMG and drag `ASAPS Builder.app` to Applications.
            **Windows**: Run the installer and follow the prompts.

            ### Auto-Update
            The app will automatically check for updates and notify you when a new version is available.

            ### What's New
            <!-- Add release notes here before publishing -->
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
