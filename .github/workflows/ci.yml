name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      # npm install (not 'npm ci') to tolerate npm's cross-platform optional-dep gap — see build-desktop.yml for the long story.
      run: npm install --no-audit --no-fund

    - name: Run build
      run: npm run build

    - name: Run TypeScript type checking
      run: npm run type-check

    - name: Run ESLint
      run: npm run lint

    - name: Run tests
      # Per-workspace and sequential — never `npx vitest` from the repo root
      # (no root vitest config → wrong environment → phantom failures) and never
      # in parallel (the workspace suites can deadlock). apps/* have no test
      # script, so they're listed explicitly here rather than run via the
      # `--workspaces` runner (which errors on the missing script). Runs after
      # the build step so @asaps/builder resolves @asaps/core from its dist.
      run: |
        npm run test -w @asaps/core
        npm run test -w @asaps/renderer
        npm run test -w @asaps/builder

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      # npm install (not 'npm ci') to tolerate npm's cross-platform optional-dep gap — see build-desktop.yml for the long story.
      run: npm install --no-audit --no-fund

    - name: Run security audit
      # Audit production deps only. Build-tool transitives (esbuild,
      # vite, capacitor's bundled tar, vitest) routinely surface as
      # high/critical on Linux runners but never ship — none reach
      # the built DMG / exe / web bundle. Reviewed manually each
      # release; ci.yml just guards against a regression in shipped
      # deps.
      run: npm audit --audit-level=critical --omit=dev

# Tests now run in the `build` job above (core + renderer + builder, ~5000
# tests). A few legacy suites remain quarantined as `*.test.ts.skip` — the
# IndexedDB-hanging HybridStorageAdapter and some jest-style mocks awaiting
# vitest conversion; rename them back to `.ts` to re-include once modernized.
